<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materiais Usadosbr</title>
<meta name="description" content="Vídeos tutoriais da Usadosbr.">
<link rel="icon" href="assets/icone-u.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B2D4E;
    --verde: #19C267;
    --lima: #A9E34B;
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --text: #13202E;
    --muted: #5B6B7C;
    --border: #DCE3EA;
    --chip: #E8EEF4;
    --chip-text: #0B2D4E;
    --alert-bg: #FFF4E5;
    --alert-text: #7A4100;
    --alert-border: #F5B759;
    --focus: #19C267;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0A1724;
      --surface: #102336;
      --text: #E8EEF4;
      --muted: #9FB0C2;
      --border: #1F3A55;
      --chip: #17324D;
      --chip-text: #E8EEF4;
      --alert-bg: #3A2A10;
      --alert-text: #FFD9A0;
      --alert-border: #8A5A12;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 "Nunito Sans", system-ui, sans-serif;
  }
  h1, h2, h3, .marca-texto { font-family: Poppins, system-ui, sans-serif; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Topo */
  .topo {
    position: sticky; top: 0; z-index: 10; background: var(--navy); color: #fff;
    display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap;
  }
  .marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; flex-shrink: 0; }
  .marca img { height: 30px; width: auto; display: block; }
  .marca-texto { font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
  .marca-texto span { color: var(--lima); }
  .marca-sub { font-size: 13px; color: #B9CCE0; border-left: 1px solid #2B4D70; padding-left: 10px; }
  .busca { flex: 1 1 260px; display: flex; max-width: 560px; margin-left: auto; }
  .busca input {
    width: 100%; padding: 9px 14px; border-radius: 999px; border: 1px solid #2B4D70;
    background: #0E3860; color: #fff; font: inherit;
  }
  .busca input::placeholder { color: #9FB6CD; }

  /* Filtros */
  .filtros { display: flex; gap: 8px; padding: 14px 16px 4px; overflow-x: auto; }
  .chip {
    border: 0; background: var(--chip); color: var(--chip-text); padding: 7px 14px;
    border-radius: 8px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--navy); color: #fff; }
  @media (prefers-color-scheme: dark) { .chip[aria-pressed="true"] { background: var(--verde); color: #04210F; } }

  main { padding: 12px 16px 40px; max-width: 1600px; margin: 0 auto; }

  /* Grade */
  .grade { display: grid; gap: 24px 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { display: block; text-decoration: none; color: inherit; border-radius: var(--radius); }
  .thumb {
    position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden;
    background: var(--navy);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .card:hover .thumb img { transform: scale(1.03); }
  .capa {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 14px; color: #fff; background: linear-gradient(135deg, #0B2D4E 0%, #134673 100%);
  }
  .capa::before {
    content: ""; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px;
    border-radius: 50%; background: var(--verde); opacity: .25;
  }
  .capa strong { font-family: Poppins, sans-serif; font-size: 16px; line-height: 1.3; position: relative; }
  .capa small { color: var(--lima); font-weight: 700; position: relative; margin-bottom: 4px; }
  .duracao {
    position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #fff;
    font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
  }
  .tag-interno {
    position: absolute; left: 8px; top: 8px; background: #FFB020; color: #3A2400;
    font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
  }
  .info { display: flex; gap: 12px; padding-top: 10px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--navy); flex-shrink: 0;
    display: grid; place-items: center; overflow: hidden; color: var(--lima);
    font: 700 16px Poppins, sans-serif;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .info h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35; }
  .canal { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .canal .rot { display: inline-block; margin-left: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .vazio { color: var(--muted); padding: 40px 0; text-align: center; }

  /* Assistir */
  .assistir { display: grid; gap: 24px; }
  @media (min-width: 1000px) { .assistir { grid-template-columns: minmax(0, 1fr) 380px; } }
  .player {
    aspect-ratio: 16 / 9; background: #000; border-radius: var(--radius); overflow: hidden; position: relative;
  }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .sem-link {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px;
    color: #fff; background: linear-gradient(135deg, #0B2D4E 0%, #134673 100%);
  }
  .sem-link p { margin: 6px 0 0; color: #B9CCE0; font-size: 14px; }
  .sem-link strong { font: 600 18px Poppins, sans-serif; }
  .assistir h1 { font-size: 20px; line-height: 1.3; margin: 14px 0 8px; }
  @media (min-width: 700px) { .assistir h1 { font-size: 22px; } }
  .linha-canal { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .linha-canal .nome { font-weight: 700; }
  .linha-canal .acoes { margin-left: auto; }
  .btn {
    border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer; font-weight: 700;
    background: var(--verde); color: #04210F; display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover { filter: brightness(1.05); }
  .caixa { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-top: 14px; }
  .caixa p { margin: 0; }
  .caixa .meta { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .alerta {
    background: var(--alert-bg); color: var(--alert-text); border: 1px solid var(--alert-border);
    border-radius: var(--radius); padding: 12px 16px; margin-top: 14px; font-weight: 600;
  }
  .alerta strong { display: block; }
  .passos { margin: 0; padding: 0; list-style: none; counter-reset: p; }
  .passos li { counter-increment: p; display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); }
  .passos li:first-child { border-top: 0; }
  .passos li::before {
    content: counter(p); flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    background: var(--navy); color: #fff; display: grid; place-items: center; font: 600 13px Poppins, sans-serif;
  }
  @media (prefers-color-scheme: dark) { .passos li::before { background: var(--verde); color: #04210F; } }
  .caixa h2, .mais h2 { font-size: 16px; margin: 0 0 8px; }
  .mais .lista { display: grid; gap: 12px; }
  .mini { display: grid; grid-template-columns: 168px 1fr; gap: 10px; text-decoration: none; color: inherit; border-radius: 8px; }
  .mini .thumb { border-radius: 8px; }
  .mini .capa { padding: 8px; }
  .mini .capa strong { font-size: 12px; }
  .mini .capa small { display: none; }
  .mini h3 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.3; }
  .voltar { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; color: var(--muted); text-decoration: none; font-weight: 600; }
  .voltar:hover { color: var(--text); }
  .aviso-copia { font-size: 13px; color: var(--muted); margin-left: 8px; }
</style>
</head>
<body>
<header class="topo">
  <a class="marca" href="#" aria-label="Materiais Usadosbr, início">
    <img src="assets/logo-usadosbr.png" alt="Usadosbr" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'marca-texto',innerHTML:'usados<span>br</span>'}))">
    <span class="marca-sub">Materiais</span>
  </a>
  <form class="busca" role="search" onsubmit="event.preventDefault()">
    <label for="q" class="sr-only">Buscar vídeos</label>
    <input id="q" type="search" placeholder="Buscar vídeos" autocomplete="off">
  </form>
</header>

<nav class="filtros" aria-label="Filtrar por categoria" id="filtros">
  <button class="chip" type="button" data-cat="todos" aria-pressed="true">Todos</button>
  <button class="chip" type="button" data-cat="egv" aria-pressed="false">EGV</button>
  <button class="chip" type="button" data-cat="lojas" aria-pressed="false">Lojas</button>
</nav>

<main id="app" tabindex="-1"></main>

<script src="materiais.js"></script>
<script>
(function () {
  var VIDEOS = Array.isArray(window.MATERIAIS) ? window.MATERIAIS : [];
  var app = document.getElementById('app');
  var q = document.getElementById('q');
  var filtros = document.getElementById('filtros');
  var estado = { cat: 'todos', busca: '' };
  var ROTULO = { egv: 'EGV', lojas: 'Lojas' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Aceita o link inteiro do Drive (ou só o ID) e devolve o ID.
  function driveId(link) {
    if (!link) return '';
    link = String(link).trim();
    var m = link.match(/\/d\/([\w-]{10,})/) || link.match(/[?&]id=([\w-]{10,})/);
    if (m) return m[1];
    return /^[\w-]{10,}$/.test(link) ? link : '';
  }

  function normal(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function capa(v) {
    return '<div class="capa" aria-hidden="true"><small>Usadosbr</small><strong>' + esc(v.titulo) + '</strong></div>';
  }

  function thumb(v) {
    var id = driveId(v.drive);
    var img = id
      ? '<img src="https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w640" alt="" loading="lazy" onerror="this.outerHTML=this.parentNode.dataset.capa">'
      : capa(v);
    return '<div class="thumb" data-capa="' + esc(capa(v)) + '">' + img +
      (v.interno ? '<span class="tag-interno">Uso interno</span>' : '') +
      '<span class="duracao">' + esc(v.duracao) + '</span></div>';
  }

  function rotulos(v) {
    return (v.categoria || []).map(function (c) { return ROTULO[c] || c; }).join(' · ');
  }

  function filtrados() {
    var b = normal(estado.busca);
    return VIDEOS.filter(function (v) {
      var okCat = estado.cat === 'todos' || (v.categoria || []).indexOf(estado.cat) >= 0;
      var okBusca = !b || normal(v.titulo + ' ' + v.descricao + ' ' + (v.passos || []).join(' ')).indexOf(b) >= 0;
      return okCat && okBusca;
    });
  }

  function renderGrade() {
    document.title = 'Materiais Usadosbr';
    filtros.hidden = false;
    var lista = filtrados();
    if (!lista.length) {
      app.innerHTML = '<p class="vazio">Nenhum vídeo encontrado.</p>';
      return;
    }
    app.innerHTML = '<h1 class="sr-only">Vídeos</h1><div class="grade">' + lista.map(function (v) {
      return '<a class="card" href="#' + esc(v.id) + '">' + thumb(v) +
        '<div class="info"><div class="avatar" aria-hidden="true">U</div><div>' +
        '<h3>' + esc(v.titulo) + '</h3>' +
        '<div class="canal">Usadosbr<span class="rot">' + esc(rotulos(v)) + '</span></div>' +
        '</div></div></a>';
    }).join('') + '</div>';
  }

  function renderAssistir(v) {
    document.title = v.titulo + ' · Materiais Usadosbr';
    filtros.hidden = true;
    var id = driveId(v.drive);
    var player = id
      ? '<iframe src="https://drive.google.com/file/d/' + encodeURIComponent(id) + '/preview" title="' + esc(v.titulo) + '" allow="autoplay; fullscreen" allowfullscreen></iframe>'
      : '<div class="sem-link"><div><strong>Link do Drive ainda não cadastrado</strong><p>O vídeo aparecerá aqui assim que o link for incluído.</p></div></div>';

    var outros = VIDEOS.filter(function (o) { return o.id !== v.id; });

    app.innerHTML =
      '<div class="assistir"><div>' +
        '<a class="voltar" href="#">&larr; Todos os vídeos</a>' +
        '<div class="player">' + player + '</div>' +
        '<h1>' + esc(v.titulo) + '</h1>' +
        '<div class="linha-canal"><div class="avatar" aria-hidden="true">U</div>' +
          '<div><div class="nome">Usadosbr</div><div class="canal">' + esc(rotulos(v)) + ' · ' + esc(v.duracao) + '</div></div>' +
          '<div class="acoes"><button class="btn" type="button" id="copiar">Copiar link do vídeo</button><span class="aviso-copia" id="copiado" role="status"></span></div>' +
        '</div>' +
        (v.interno ? '<div class="alerta" role="note"><strong>Uso interno: GP, GN e Corban do C6 Bank.</strong>Não envie às corretoras.</div>' : '') +
        '<div class="caixa"><p>' + esc(v.descricao) + '</p></div>' +
        ((v.passos && v.passos.length) ? '<section class="caixa" aria-labelledby="neste"><h2 id="neste">Neste vídeo</h2><ol class="passos">' +
          v.passos.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol></section>' : '') +
      '</div>' +
      '<aside class="mais" aria-labelledby="mais-t"><h2 id="mais-t">Mais vídeos</h2><div class="lista">' +
        outros.map(function (o) {
          return '<a class="mini" href="#' + esc(o.id) + '">' + thumb(o) +
            '<div><h3>' + esc(o.titulo) + '</h3><div class="canal">Usadosbr</div></div></a>';
        }).join('') +
      '</div></aside></div>';

    document.getElementById('copiar').addEventListener('click', function () {
      var url = location.href.split('#')[0] + '#' + v.id;
      var aviso = document.getElementById('copiado');
      function ok() { aviso.textContent = 'Link copiado!'; setTimeout(function () { aviso.textContent = ''; }, 2500); }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(ok, function () { fallback(url); ok(); });
      } else { fallback(url); ok(); }
    });
    window.scrollTo(0, 0);
    app.focus({ preventScroll: true });
  }

  function fallback(texto) {
    var t = document.createElement('textarea');
    t.value = texto; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (e) {}
    t.remove();
  }

  function rota() {
    var h = decodeURIComponent(location.hash.slice(1));
    var v = h && VIDEOS.find(function (x) { return x.id === h; });
    if (v) renderAssistir(v); else renderGrade();
  }

  filtros.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    estado.cat = b.dataset.cat;
    filtros.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); });
    renderGrade();
  });

  q.addEventListener('input', function () {
    estado.busca = q.value;
    if (location.hash.length > 1) { history.pushState(null, '', location.pathname + location.search); }
    renderGrade();
  });

  window.addEventListener('hashchange', rota);
  rota();
})();
</script>
</body>
</html>
